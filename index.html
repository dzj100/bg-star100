<title>桌游助手合集</title>

<meta property="og:title" content="桌游助手合集">
<meta property="og:description" content="狼人真言、夺狗囧事、印加宝藏、捉虫猫日记、登山家、UNO、海底探险、月面探险、弑君者、无赖勇者、时序谜局、煞有其时、渗透因子、车票收藏家、巫师牌 — 多人聚会桌游在线助手">

<style>
:root {
  --bg: #6d4a2b;
  --surface: #f8f1e0;
  --card-bg: #fdf9ee;
  --accent: #c93b2f;
  --gold: #b0741a;
  --gold-l: #e8b64c;
  --text: #2b2620;
  --text-dim: #8a7c66;
  --radius: 14px;
  --line: rgba(43,38,32,.12);
  --tb: calc(88px + env(safe-area-inset-top));
  --rail-w: 56px;
  --shell-w: calc(var(--rail-w) + 520px);
  --shell-half: calc(var(--rail-w) / 2 + 260px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
/* 背景 = 深胡桃木桌：底色 + 顶光 + 宽色斑 + 细木纹（SVG 噪声，无缝平铺） */
body { font-family:-apple-system,system-ui,sans-serif; color:var(--text); min-height:100dvh; overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 50% -120px, rgba(255,226,178,.18), rgba(255,226,178,0) 72%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='640' height='640'><filter id='g' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.005 0.055' numOctaves='5' seed='13' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.62 0 0 0 0 0.44 0 0 0 0 0.26 0.55 0 0 0 -0.20'/></filter><rect width='640' height='640' filter='url(%23g)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='960' height='960'><filter id='p' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.0026 0.010' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.55 0 0 0 0 0.37 0 0 0 0 0.19 0.85 0 0 0 -0.42'/></filter><rect width='960' height='960' filter='url(%23p)'/></svg>");
  background-repeat:no-repeat, repeat, repeat; }
body.modal-open { overflow:hidden; }
a { text-decoration:none; color:inherit; }
button { font-family:inherit; }

/* ---------------- 顶栏 + 搜索 ---------------- */
.shell { max-width:var(--shell-w); margin:0 auto; }
.topbar { position:sticky; top:0; z-index:40; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:rgba(84,58,34,.90); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,0,0,.35); }
.topbar h1 { font-size:1rem; font-weight:800; color:#d9a94b; letter-spacing:.08em; margin:0 2px 8px; text-shadow:0 1px 2px rgba(0,0,0,.45); }
.search-btn { display:flex; align-items:center; gap:8px; width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card-bg); box-shadow:0 2px 8px rgba(0,0,0,.30); color:var(--text-dim); font-size:.88rem; cursor:pointer; text-align:left; transition:border-color .15s, box-shadow .15s; }
.search-btn:hover { border-color:rgba(176,116,26,.55); box-shadow:0 3px 12px rgba(0,0,0,.40); }
.search-btn svg { flex:none; color:var(--gold); }

/* ---------------- 左侧导航（固定定位：不随滚动重算，手机贴屏左侧，PC 随容器居中） ---------------- */
.rail { position:fixed; left:max(0px, calc(50% - var(--shell-half))); top:calc(var(--tb) - 8px); bottom:-160px; z-index:30; width:var(--rail-w); display:flex; flex-direction:column; background:rgba(76,50,27,.95); border-right:1px solid rgba(0,0,0,.30); box-shadow:2px 0 12px rgba(0,0,0,.25); padding-bottom:env(safe-area-inset-bottom); }
.rail-nav { display:flex; flex-direction:column; width:100%; padding-top:8px; }
.tab { position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; padding:15px 0 13px; border:none; background:transparent; color:rgba(244,233,215,.72); font-size:.72rem; font-weight:800; letter-spacing:.08em; cursor:pointer; transition:background .18s, color .18s; }
.tab-ico { font-size:18px; line-height:1; }
.tab:hover { color:rgba(250,241,226,.96); background:rgba(255,240,214,.07); }
.tab.active { color:var(--gold-l); background:rgba(255,240,214,.10); }
.tab.active::after { content:''; position:absolute; right:0; top:0; bottom:0; width:3px; background:var(--gold-l); }

/* ---------------- 内容 ---------------- */
#portal { margin-left:var(--rail-w); min-width:0; max-width:520px; padding:16px 16px 28px; min-height:calc(100dvh - var(--tb)); display:flex; flex-direction:column; }
.content { flex:1; min-width:0; display:flex; flex-direction:column; gap:26px; }
.section { scroll-margin-top:calc(var(--tb) + 10px); }
.section-head { display:flex; align-items:center; gap:8px; margin:0 2px 12px; }
.section-head h2 { font-size:.92rem; letter-spacing:.14em; color:#f3e7d0; text-shadow:0 1px 2px rgba(0,0,0,.40); }
.section-count { font-size:.66rem; font-weight:700; color:var(--text-dim); background:rgba(253,249,238,.95); border:1px solid var(--line); border-radius:999px; padding:2px 8px; box-shadow:0 1px 3px rgba(0,0,0,.20); }

.game-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.game-card { display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px 12px; background:var(--card-bg); border:1px solid rgba(43,38,32,.09); border-radius:var(--radius); box-shadow:0 3px 10px rgba(0,0,0,.35); text-align:center; min-width:0; transition:transform .15s, box-shadow .15s; }
@media (hover:hover) { .game-card:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(0,0,0,.45); } }
.game-card:active { transform:scale(.96); }
.card-icon { height:40px; display:flex; align-items:center; justify-content:center; font-size:33px; line-height:1; }
.card-icon .ico-svg { height:36px; width:auto; }
.card-icon .ico-img { width:38px; height:38px; object-fit:contain; }
.card-title { font-size:.84rem; font-weight:700; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-meta { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px 6px; max-width:100%; }
.tag { font-size:.63rem; font-weight:800; line-height:1; padding:3px 7px; border-radius:999px; background:rgba(176,116,26,.15); color:#8a5a14; white-space:nowrap; }
.card-type { font-size:.66rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

.portal-footer { margin-top:34px; text-align:center; font-size:.72rem; color:rgba(240,225,200,.68); text-shadow:0 1px 2px rgba(0,0,0,.35); }

/* ---------------- 搜索弹窗 ---------------- */
.modal-mask { position:fixed; inset:0; z-index:100; background:rgba(26,16,8,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-mask.hidden { display:none; }
.modal { width:min(440px,100%); max-height:min(84dvh,660px); background:var(--surface); border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,.45); display:flex; flex-direction:column; overflow:hidden; animation:pop .18s ease; }
@keyframes pop { from { transform:translateY(14px) scale(.98); opacity:.5; } to { transform:none; opacity:1; } }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:15px 16px 11px; }
.modal-head h3 { font-size:.98rem; }
.modal-close { position:relative; width:28px; height:28px; border:none; border-radius:50%; background:rgba(43,38,32,.10); color:var(--text-dim); font-size:.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close::after { content:''; position:absolute; inset:-8px; }
.modal-body { flex:1; min-height:0; padding:0 16px 16px; display:flex; flex-direction:column; gap:13px; }
.field-label { display:block; font-size:.72rem; font-weight:800; color:var(--text-dim); letter-spacing:.06em; margin-bottom:7px; }
.search-input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card-bg); font-size:.9rem; font-family:inherit; color:var(--text); outline:none; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; }
.search-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(176,116,26,.20); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:6px 11px; border:1px solid var(--line); border-radius:999px; background:var(--card-bg); color:var(--text-dim); font-size:.74rem; font-weight:700; cursor:pointer; transition:background .12s, color .12s, border-color .12s; }
.chip.active { background:var(--gold); border-color:var(--gold); color:#fff; }
.result-head { display:flex; align-items:center; justify-content:space-between; font-size:.72rem; font-weight:700; color:var(--text-dim); }
#resetBtn { border:none; background:none; color:var(--accent); font-size:.72rem; font-weight:800; cursor:pointer; padding:2px 0; }
.results { flex:1; min-height:96px; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:8px; margin:0 -2px; padding:2px; }
.result-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:12px; background:var(--card-bg); transition:transform .12s, border-color .12s; }
.result-item:hover { border-color:rgba(176,116,26,.5); }
.result-item:active { transform:scale(.98); }
.result-icon { flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:21px; line-height:1; }
.result-icon .ico-svg { height:24px; width:auto; }
.result-icon .ico-img { width:24px; height:24px; object-fit:contain; }
.result-main { flex:1; min-width:0; }
.result-name { display:block; font-size:.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-sub { display:block; font-size:.67rem; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-mode { flex:none; font-size:.63rem; font-weight:800; padding:3px 8px; border-radius:999px; }
.mode-solo { background:rgba(76,150,94,.18); color:#35743f; }
.mode-online { background:rgba(201,59,47,.15); color:#ad3226; }
.empty { padding:26px 0; text-align:center; font-size:.8rem; color:var(--text-dim); }

@media (max-width:560px) {
  .modal-mask { align-items:flex-end; padding:0; }
  .modal { width:100%; max-height:82dvh; border-radius:18px 18px 0 0; padding-bottom:env(safe-area-inset-bottom); }
}
@media (max-width:360px) {
  :root { --rail-w:50px; }
  #portal { padding-left:12px; padding-right:12px; }
  .topbar { padding-left:12px; padding-right:12px; }
  .game-grid { gap:8px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  .modal { animation:none; }
}
</style>
</head>
<body>
<img src="/og-icon.png" width="300" height="300" style="position:absolute;left:-9999px;top:-9999px;" alt="桌游助手合集">

<div class="shell">

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>

</div><!-- /.shell -->

<div class="modal-mask hidden" id="searchModal" role="dialog" aria-modal="true" aria-label="搜索桌游">

      <div class="result-head">
        <span id="resultCount"></span>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="results" id="results"></div>
    </div>
  </div>
</div>

  { mode:'solo',   name:'无赖勇者',   players:'1人',    min:1, max:1,  type:'单人扑克闯关', icon:'🗡️',    url:'scoundrel/index.html' },
  { mode:'solo',   name:'神探缉凶',   players:'1人',    min:1, max:1,  type:'人机对战推理', icon:'🕵️',   url:'fugitive/index.html' },
  { mode:'solo',   name:'煞有其时',   players:'1~2人',    min:1, max:2,  type:'策略抽象棋',   icon:'⏳',    url:'that_time_you_killed_me/index.html' },
  { mode:'solo',   name:'渗透因子',   players:'1人',    min:1, max:1,  type:'人机合作推理', icon:ICO_INFIL, url:'infiltraitors/index.html' },
  { mode:'solo',   name:'车票收藏家', players:'3~6人',  min:3, max:6,  type:'欢乐竞争博弈',   icon:ICO_TICKET, url:'ticket-collector/index.html' },
  { mode:'solo',   name:'巫师牌',     players:'1人',  min:1, max:1,  type:'人机吃墩博弈',   icon:ICO_WIZ, url:'wizard/index.html' },
  { mode:'solo',   name:'棕榈岛',     players:'1人',  min:1, max:1,  type:'单人卡牌构筑',   icon:'🌴',    url:'palm-island/index.html' },
  /* —— 联机 —— */
  { mode:'online', name:'弑君者OL',   players:'2~4人',  min:2, max:4,  type:'合作扑克闯关', icon:'⚔️',    url:'regicide/index_ol.html' },
  { mode:'online', name:'月面探险OL', players:'2~5人',  min:2, max:5,  type:'合作角色扮演', icon:'🌕',    url:'moon-adventure/index_ol.html' },
  { mode:'online', name:'时序谜局OL', players:'2~4人',  min:2, max:4,  type:'合作默契配合', icon:'🕰️',    url:'take-time/index.html' },
  { mode:'online', name:'神探缉凶OL', players:'2人',    min:2, max:2,  type:'1v1对战策略推理', icon:'🕵️', url:'fugitive/index_ol.html' },
  { mode:'online', name:'渗透因子OL', players:'2~5人',  min:2, max:5,  type:'合作推理烧脑', icon:ICO_INFIL, url:'infiltraitors/index_ol.html' }
];

/* ---------------- 渲染列表 ---------------- */
/* 按模式拆分数据，一次性渲染两个网格并写入数量徽标 */
var SOLO = GAMES.filter(function(g){ return g.mode === 'solo'; });
var ONLINE = GAMES.filter(function(g){ return g.mode === 'online'; });

/* 生成单个游戏卡片的 HTML（列表网格与“常玩”分区共用；data-name 供点击计数） */
function cardHTML(g){
  return '<a class="game-card" href="' + g.url + '" data-name="' + g.name + '">' +
    '<span class="card-icon">' + g.icon + '</span>' +
    '<span class="card-title">' + g.name + '</span>' +
    '<span class="card-meta"><span class="tag">' + g.players + '</span><span class="card-type">' + g.type + '</span></span>' +
  '</a>';
}

document.getElementById('grid-solo').innerHTML = SOLO.map(cardHTML).join('');
document.getElementById('grid-online').innerHTML = ONLINE.map(cardHTML).join('');
document.getElementById('count-solo').textContent = SOLO.length + ' 款';
document.getElementById('count-online').textContent = ONLINE.length + ' 款';

/* ---------------- 常玩：localStorage 记录打开次数，取前 3 ---------------- */
var PLAY_KEY = 'bg-star100:plays';

/* 读取打开次数表 { 游戏名: 次数 }；无记录或解析失败返回空对象 */
function readPlays(){
  try { return JSON.parse(localStorage.getItem(PLAY_KEY)) || {}; } catch (e) { return {}; }
}

/* 有历史记录时：nav 顶部插入“🔥常玩”tab，内容区首部插入常玩分区（按次数倒序取前 3，不足 3 个显示全部） */
(function buildFav(){
  var plays = readPlays();
  var favs = GAMES.filter(function(g){ return plays[g.name] > 0; })
    .sort(function(a, b){ return plays[b.name] - plays[a.name]; })
    .slice(0, 3);
  if (!favs.length) return;
  var railNav = document.querySelector('.rail-nav');
  var tab = document.createElement('button');
  tab.type = 'button';
  tab.className = 'tab';
  tab.dataset.target = 'sec-fav';
  tab.innerHTML = '<span class="tab-ico">🔥</span>常玩';
  railNav.insertBefore(tab, railNav.firstChild);

  var sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-fav';
  sec.innerHTML = '<div class="section-head"><h2>常玩</h2><span class="section-count">' + favs.length + ' 款</span></div>' +
    '<div class="game-grid">' + favs.map(cardHTML).join('') + '</div>';
  var content = document.querySelector('.content');
  content.insertBefore(sec, content.firstChild);
})();

/* 打开次数记录：点击任意游戏卡片/搜索结果 +1 并写回 localStorage（写入失败不影响跳转） */
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[data-name]');
  if (!a) return;
  var plays = readPlays();
  plays[a.dataset.name] = (plays[a.dataset.name] || 0) + 1;
  try { localStorage.setItem(PLAY_KEY, JSON.stringify(plays)); } catch (e) {}
});

/* ---------------- 搜索弹窗 ---------------- */
var modal = document.getElementById('searchModal');
var nameInput = document.getElementById('searchName');
var chipsWrap = document.getElementById('peopleChips');
var resultsEl = document.getElementById('results');
var resultCount = document.getElementById('resultCount');
var curPlayers = 0;

/* 生成人数 chips：0 → “不限”，1~10 为具体人数 */
(function buildChips(){
  var html = '';
  for (var i = 0; i <= 10; i++) {
    html += '<button type="button" class="chip' + (i === 0 ? ' active' : '') + '" data-num="' + i + '">' + (i === 0 ? '不限' : i) + '</button>';
  }
  chipsWrap.innerHTML = html;
})();

/* 弹窗筛选：名称模糊匹配（忽略大小写）+ 人数需落在 [min,max] 内 */
function matchGames(){
  var q = nameInput.value.trim().toLowerCase();
  return GAMES.filter(function(g){
    if (curPlayers && (curPlayers < g.min || curPlayers > g.max)) return false;
    if (q && g.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

/* 渲染弹窗结果列表与计数文案（无命中时显示空状态） */
function renderResults(){
  var list = matchGames();
  var filtered = !!(nameInput.value.trim() || curPlayers);
  resultCount.textContent = filtered ? ('找到 ' + list.length + ' 款桌游') : ('共 ' + GAMES.length + ' 款桌游');
  if (!list.length) {
    resultsEl.innerHTML = '<div class="empty">没有找到匹配的桌游，换个条件试试～</div>';
    return;
  }
  resultsEl.innerHTML = list.map(function(g){
    return '<a class="result-item" href="' + g.url + '" data-name="' + g.name + '">' +
      '<span class="result-icon">' + g.icon + '</span>' +
      '<span class="result-main">' +
        '<span class="result-name">' + g.name + '</span>' +
        '<span class="result-sub">' + g.players + ' · ' + g.type + '</span>' +
      '</span>' +
      '<span class="result-mode ' + (g.mode === 'online' ? 'mode-online' : 'mode-solo') + '">' + (g.mode === 'online' ? '联机' : '单机') + '</span>' +
    '</a>';
  }).join('');
}

/* 打开搜索弹窗：显示遮罩 + 锁定页面滚动 + 重算结果，桌面端自动聚焦输入框 */
function openModal(){
  modal.classList.remove('hidden');
  document.body.classList.add('modal-open');
  renderResults();
  if (window.matchMedia && matchMedia('(pointer:fine)').matches) nameInput.focus();
}

/* 关闭搜索弹窗：隐藏并恢复页面滚动 */
function closeModal(){
  modal.classList.add('hidden');
  document.body.classList.remove('modal-open');
}

/* 弹窗事件绑定：开/关按钮、点遮罩关闭、Esc 关闭、输入与 chips 实时筛选、重置 */
document.getElementById('searchBtn').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', function(e){ if (e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
});
nameInput.addEventListener('input', renderResults);
chipsWrap.addEventListener('click', function(e){
  var btn = e.target.closest('.chip');
  if (!btn) return;
  var chips = chipsWrap.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('active', chips[i] === btn);
  curPlayers = +btn.dataset.num;
  renderResults();
});
document.getElementById('resetBtn').addEventListener('click', function(){
  nameInput.value = '';
  curPlayers = 0;
  var chips = chipsWrap.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('active', chips[i].dataset.num === '0');
  renderResults();
});

/* ---------------- 左 TAB：点击跳转 + 滚动联动高亮 ---------------- */
var tabs = [].slice.call(document.querySelectorAll('.tab'));
var secs = [].slice.call(document.querySelectorAll('.content .section'));
var activeTarget = 'sec-solo';
var spyLock = 0;

/* 切换 TAB 高亮（activeTarget 缓存当前值，避免重复改 DOM） */
function setActive(target){
  if (activeTarget === target) return;
  activeTarget = target;
  tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.target === target); });
}

/* 滚动联动：顶部(≤16px)高亮首个分区；中途取越过 55% 视口线的最后一个分区；触底高亮最后一个分区 */
function spy(){
  if (Date.now() < spyLock) return;
  var active = secs[0].id;
  if (window.scrollY > 16) { /* 顶部时高亮首个分区（有常玩即常玩） */
    var probe = window.innerHeight * 0.55;
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].getBoundingClientRect().top <= probe) active = secs[i].id;
    }
  }
  var last = secs[secs.length - 1];
  var bottomReached = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  if (bottomReached && last.getBoundingClientRect().top < window.innerHeight) active = last.id;
  setActive(active);
}

window.addEventListener('scroll', spy, { passive:true });
window.addEventListener('resize', spy);

/* TAB 点击：滚动到对应分区（尊重 prefers-reduced-motion），700ms 内锁定联动避免抢高亮 */
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    var target = document.getElementById(t.dataset.target);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (target) target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block:'start' });
    spyLock = Date.now() + 700;
    setActive(t.dataset.target);
  });
});

spy();
})();
</script>
</body>
</html>

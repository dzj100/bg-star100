<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>桌游助手合集</title>
<meta name="description" content="狼人真言、夺狗囧事、印加宝藏、捉虫猫日记、登山家、UNO、海底探险、月面探险、弑君者、无赖勇者、时序谜局 — 多人聚会桌游在线助手">
<meta property="og:title" content="桌游助手合集">
<meta property="og:description" content="狼人真言、夺狗囧事、印加宝藏、捉虫猫日记、登山家、UNO、海底探险、月面探险、弑君者、无赖勇者、时序谜局 — 多人聚会桌游在线助手">
<meta property="og:image" content="https://bg-star100.pages.dev/og-icon.png">
<meta property="og:type" content="website">
<link rel="icon" href="og-icon.png">
<style>
:root {
  --bg: #d6e8f0;
  --surface: #faf5eb;
  --card-bg: #fff8ee;
  --accent: #d94f5c;
  --gold: #e8a832;
  --text: #3d3228;
  --text-dim: #8a7e72;
  --radius: 14px;
  --blue: #5ba4d9;
  --orange: #e8943a;
  --green: #5aad5e;
  --purple: #b55dae;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; overflow-x:hidden; }

#portal { display:flex; flex-direction:column; align-items:center; padding:32px 16px; padding-top:max(32px, env(safe-area-inset-top)); min-height:100dvh; }
.portal-header { text-align:center; margin-bottom:40px; }
.portal-header h1 { font-size:1.8rem; color:var(--gold); margin-bottom:6px; }
.portal-header p { color:var(--text-dim); font-size:.9rem; }

.game-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:100%; max-width:400px; }
.game-card { background:var(--surface); border-radius:var(--radius); padding:20px 16px; text-align:center; cursor:pointer; transition:transform .15s, box-shadow .15s; box-shadow:0 2px 8px rgba(60,50,40,.08); display:flex; flex-direction:column; align-items:center; gap:10px; }
.game-card:active { transform:scale(.96); }
.game-card .card-icon { font-size:40px; line-height:1; }
.game-card .card-title { font-size:.95rem; font-weight:bold; color:var(--text); }
.game-card .card-desc { font-size:.75rem; color:var(--text-dim); line-height:1.3; }

.game-card:nth-child(1) .card-icon { color:var(--purple); }
.game-card:nth-child(2) .card-icon { color:var(--orange); }
.game-card:nth-child(3) .card-icon { color:var(--gold); }
.game-card:nth-child(4) .card-icon { color:var(--green); }
.game-card:nth-child(5) .card-icon { color:var(--blue); }
.game-card:nth-child(6) .card-icon { color:var(--accent); }
.game-card:nth-child(7) .card-icon { color:var(--blue); }
.game-card:nth-child(8) .card-icon { color:#45bab2; }
.game-card:nth-child(9) .card-icon { color:#8e6bb5; }
.game-card:nth-child(10) .card-icon { color:#8a93a8; }
.game-card:nth-child(11) .card-icon { color:#1a6d8f; }

.online-section { width:100%; max-width:400px; margin-top:32px; }
.section-title { font-size:.85rem; color:var(--text-dim); margin:0 0 14px; text-align:center; letter-spacing:.2em; }
.online-list { display:flex; flex-direction:column; gap:10px; }
.online-item { background:var(--surface); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:0 2px 8px rgba(60,50,40,.08); transition:transform .15s, box-shadow .15s; }
.online-item:active { transform:scale(.97); }
.online-icon { font-size:24px; line-height:1; }
.online-name { font-size:.95rem; font-weight:bold; color:var(--text); }
.online-desc { margin-left:auto; font-size:.75rem; color:var(--text-dim); }

.portal-footer { margin-top:auto; padding-top:32px; padding-bottom:16px; text-align:center; font-size:.75rem; color:var(--text-dim); }
</style>
</head>
<body>
<img src="/og-icon.png" width="300" height="300" style="position:absolute;left:-9999px;top:-9999px;" alt="桌游助手合集">

<div id="portal">
  <div class="portal-header">
    <h1>桌游助手合集</h1>
    <p>选择一个游戏开始</p>
  </div>

  <!-- <div class="section-title">🃏 线下发牌助手</div> -->

  <div class="game-grid">
    <div class="game-card" onclick="location.href='https://werewolf-word.pages.dev/'">

      <div class="card-title">狼人真言</div>
      <div class="card-desc">4~10人 欢乐聚会猜词</div>
    </div>
    <div class="game-card" onclick="location.href='https://dog-joker.pages.dev/'">

          <path d="M411.03 269.78h333.59v112.85H411.03z" fill="#45bab2"/>
          <path d="M183.33 579.94a397.77 216.46 0 1 0 795.55 0 397.77 216.46 0 1 0-795.55 0Z" fill="#45bab2"/>
          <path d="M303.27 583.85a88.55 53.88 90 1 0 107.76 0 88.55 53.88 90 1 0-107.76 0Z" fill="#10325c"/>
          <path d="M523.94 579.94a88.55 53.88 90 1 0 107.76 0 88.55 53.88 90 1 0-107.76 0Z" fill="#10325c"/>
          <path d="M744.62 583.69a88.55 53.88 90 1 0 107.76 0 88.55 53.88 90 1 0-107.76 0Z" fill="#10325c"/>
        </svg>
      </div>
      <div class="card-title">海底探险</div>
      <div class="card-desc">2~6人 骰子聚会冒险</div>
    </div>
    <div class="game-card" onclick="location.href='regicide/index.html'">

    </div>
    <div class="game-card" onclick="location.href='moon-adventure/index.html'">

      <div class="card-title">月面探险</div>

    </div>
    <div class="game-card" onclick="location.href='scoundrel/index.html'">
      <div class="card-icon">🗡️</div>
      <div class="card-title">无赖勇者</div>

    </div>
    <div class="game-card" onclick="location.href='fugitive/index.html'">
      <div class="card-icon">🕵️</div>
      <div class="card-title">神探缉凶</div>

    </div>
    <!-- <div class="game-card" onclick="location.href='abyss-echo/index.html'">
      <div class="card-icon">🐙</div>
      <div class="card-title">深渊回响 Abyss Echo</div>
      <div class="card-desc">深海克苏鲁合作肉鸽卡牌构筑</div>
    </div> -->
  </div>

  <div class="online-section">
    <div class="section-title">🎮 联机对战</div>
    <div class="online-list">
      <div class="online-item" onclick="location.href='regicide/index_ol.html'">
        <span class="online-icon">⚔️</span>
        <span class="online-name">弑君者OL</span>
        <span class="online-desc">2~4人 合作扑克闯关</span>
      </div>
      <div class="online-item" onclick="location.href='moon-adventure/index_ol.html'">
        <span class="online-icon">🌕</span>
        <span class="online-name">月面探险OL</span>
        <span class="online-desc">2~5人 合作角色扮演</span>
      </div>
      <div class="online-item" onclick="location.href='take-time/index.html'">

    </div>
  </div>

  <div class="portal-footer">@imStar100</div>
</div>

</body>
</html>

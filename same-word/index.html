<script>
(function () {
  var booted = false;
  window.__swBooted = function () { booted = true; };
  try {
    if (window.SWR && typeof SWR.init === 'function') SWR.init();
    if (window.SWN && typeof SWN.init === 'function') {
      SWN.init({
        sessionKey: 'sameword-online',
        title: '同词相遇',
        maxPlayers: 4,
        getState: function () { return SWR.getState(); },
        onWaiting: function (v) { SWR.renderWaiting(v); },
        onState: function (s, m) { SWR.applyRemote(s, m); },
        onClosed: function (r) { SWR.onRoomClosed(r); },
        onPlayerLeft: function (i) { SWR.onPlayerLeft(i); },
        onNet: function (on, silent) { SWR.setNet(on, silent); }
      });
      SWN.tryRestore().then(function (ok) {
        if (!ok && window.SWR) SWR.renderLanding();
      }).catch(function () {
        if (window.SWR) SWR.renderLanding();
      });
    } else if (window.SWR && typeof SWR.renderLanding === 'function') {
      SWR.renderLanding();
    }
  } catch (err) {
    try { if (window.SWR && typeof SWR.renderLanding === 'function') SWR.renderLanding(); } catch (e2) {}
  }
  setTimeout(function () {
    var el = document.getElementById('bootLoading');
    if (!booted && el) el.classList.add('is-stuck');
  }, 5500);
})();
</script>

# ============================================================================
# nginx.conf — 备案域名 → Supabase 反向代理
#
# 作用：微信小程序要求所有网络域名必须 ICP 备案。此代理把你的备案域名
#   https://api.your-domain.com 转发到 Supabase（含 Realtime WebSocket）。
#
# 部署位置二选一：
#   A. 国内轻量云（腾讯云/阿里云 2 核 2G 特惠款，约 40~100 元/年）
#   B. 香港轻量云（免备案服务器，但域名仍需备案，约 24~30 元/月）
#      注意：微信只校验"域名有备案"，不限制服务器所在地，但大陆访问质量 A > B。
#
# 前置步骤：
#   1. 域名完成 ICP 备案（腾讯云/阿里云免费办理，约 1~3 周）
#   2. 域名解析到本服务器，申请免费 SSL 证书（腾讯云免费 DV 证书即可）
#   3. 替换下方 your-domain.com 和 SUPABASE_HOST
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.your-domain.com;

    ssl_certificate     /etc/nginx/ssl/api.your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.your-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 替换为你的 Supabase 项目域名（不带 https://）
    set $supabase_host smcplxyjjvehbizirvrw.supabase.co;

    # 请求体上限（rooms 全量快照可能较大，酌情放宽）
    client_max_body_size 10m;

    # ---- 1. Realtime WebSocket（supabase channel / postgres_changes）----
    location /realtime/v1/ {
        proxy_pass https://$supabase_host/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
        proxy_read_timeout 3600s;   # WebSocket 长连接，别被 nginx 掐断
        proxy_send_timeout 3600s;
    }

    # ---- 2. PostgREST（.from('rooms').select()... 即走这里）----
    location /rest/v1/ {
        proxy_pass https://$supabase_host/rest/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 3. Auth（如使用 supabase auth；不用可删）----
    location /auth/v1/ {
        proxy_pass https://$supabase_host/auth/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
    }

    # ---- 4. Edge Functions（可选：云函数托管在这里防刷钻石）----
    location /functions/v1/ {
        proxy_pass https://$supabase_host/functions/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
    }

    # ---- 5. Storage（如使用，可选）----
    location /storage/v1/ {
        proxy_pass https://$supabase_host/storage/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
        proxy_request_buffering off;
    }
}

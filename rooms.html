<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>联机大厅 · star桌游助手</title>
<meta name="theme-color" content="#6d4a2b">
<meta name="robots" content="noindex">
<link rel="icon" href="og-icon.png">
<style>
:root {
  --bg:#6d4a2b; --surface:#f8f1e0; --card-bg:#fdf9ee; --accent:#c93b2f;
  --gold:#b0741a; --gold-l:#e8b64c; --text:#2b2620; --text-dim:#8a7c66;
  --radius:14px; --line:rgba(43,38,32,.12);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { font-family:-apple-system,system-ui,sans-serif; color:var(--text); min-height:100vh; min-height:100dvh; overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 50% -120px, rgba(255,226,178,.18), rgba(255,226,178,0) 72%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='640' height='640'><filter id='g' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.005 0.055' numOctaves='5' seed='13' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.62 0 0 0 0 0.44 0 0 0 0 0.26 0.55 0 0 0 -0.20'/></filter><rect width='640' height='640' filter='url(%23g)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='960' height='960'><filter id='p' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.0026 0.010' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.55 0 0 0 0 0.37 0 0 0 0 0.19 0.85 0 0 0 -0.42'/></filter><rect width='960' height='960' filter='url(%23p)'/></svg>");
  background-repeat:no-repeat, repeat, repeat; }
a { text-decoration:none; color:inherit; }
button { font-family:inherit; }
.shell { max-width:520px; margin:0 auto; }

.topbar { position:sticky; top:0; z-index:40; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:rgba(84,58,34,.90); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,0,0,.35); }
.hall-head { display:flex; align-items:center; gap:8px; }
.hall-back { flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,240,214,.08); border:1px solid rgba(255,240,214,.12); color:rgba(244,233,215,.85); font-size:1.3rem; line-height:1; }
.hall-back:hover { background:rgba(255,240,214,.16); color:#fff; }
.hall-head h1 { flex:1; font-size:1rem; font-weight:800; color:#d9a94b; letter-spacing:.08em; text-shadow:0 1px 2px rgba(0,0,0,.45); }
.hall-refresh { flex:none; display:flex; align-items:center; gap:5px; padding:6px 11px; border:1px solid rgba(255,240,214,.22); border-radius:999px; background:rgba(255,240,214,.09); color:rgba(250,241,226,.9); font-size:.7rem; font-weight:800; cursor:pointer; transition:background .15s; }
.hall-refresh:hover { background:rgba(255,240,214,.18); }
.hall-refresh:disabled { opacity:.6; cursor:default; }
.hall-refresh svg { width:13px; height:13px; }
.hall-refresh.busy svg { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.hall-sub { display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin:8px 2px 0; font-size:.66rem; color:rgba(240,225,200,.72); text-shadow:0 1px 2px rgba(0,0,0,.35); }
.live-dot { width:6px; height:6px; border-radius:50%; background:#86d99e; box-shadow:0 0 0 0 rgba(134,217,158,.55); animation:pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(134,217,158,.5); } 70% { box-shadow:0 0 0 6px rgba(134,217,158,0); } 100% { box-shadow:0 0 0 0 rgba(134,217,158,0); } }
.hall-sep { opacity:.5; }
#updatedAt { font-variant-numeric:tabular-nums; }

.hall { padding:14px 16px calc(28px + env(safe-area-inset-bottom)); }
.filters { display:flex; flex-wrap:wrap; gap:6px; margin:0 -2px; padding:2px 2px 12px; }
.filter-chip { flex:none; display:flex; align-items:center; gap:5px; padding:7px 12px; border:1px solid rgba(255,240,214,.18); border-radius:999px; background:rgba(76,50,27,.55); color:rgba(244,233,215,.78); font-size:.72rem; font-weight:700; cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
.filter-chip:hover { background:rgba(255,240,214,.12); color:#fff; }
.filter-chip.active { background:var(--gold); border-color:var(--gold); color:#fff; }
.chip-num { min-width:15px; padding:1px 5px; border-radius:999px; background:rgba(0,0,0,.18); font-size:.6rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; }
.filter-chip.active .chip-num { background:rgba(255,255,255,.22); }

.section-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 2px 10px; }
.section-bar h2 { font-size:.84rem; letter-spacing:.14em; color:#f3e7d0; text-shadow:0 1px 2px rgba(0,0,0,.4); }
.room-count { font-size:.66rem; font-weight:700; color:var(--text-dim); background:rgba(253,249,238,.95); border:1px solid var(--line); border-radius:999px; padding:2px 8px; box-shadow:0 1px 3px rgba(0,0,0,.2); }

.room-list { display:flex; flex-direction:column; gap:10px; }
.room-card { display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--card-bg); border:1px solid rgba(43,38,32,.09); border-radius:var(--radius); box-shadow:0 3px 10px rgba(0,0,0,.35); min-width:0; transition:transform .15s, box-shadow .15s, border-color .15s; }
a.room-card:active { transform:scale(.985); }
@media (hover:hover) { a.room-card:hover { transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.42); border-color:rgba(176,116,26,.45); } }
.room-card.is-full { opacity:.72; }
.room-icon { flex:none; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(176,116,26,.12); border:1px solid rgba(176,116,26,.16); font-size:22px; overflow:hidden; }
.room-icon svg { width:32px; height:32px; }
.room-main { flex:1; min-width:0; }
.room-line { display:flex; align-items:center; gap:7px; min-width:0; }
.room-title { font-size:.86rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.room-code { flex:none; padding:2px 7px; border-radius:999px; background:rgba(176,116,26,.14); color:#8a5a14; font-size:.64rem; font-weight:800; font-variant-numeric:tabular-nums; }
.room-meta { display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; margin-top:4px; font-size:.7rem; color:var(--text-dim); }
.room-host { min-width:0; max-width:170px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.room-host b { color:var(--text); font-weight:700; }
.seat-pill { flex:none; padding:2px 6px; border-radius:999px; background:rgba(76,150,94,.14); color:#35743f; font-size:.62rem; font-weight:800; }
.seat-pill.full { background:rgba(201,59,47,.13); color:#ad3226; }
.room-side { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.room-time { font-size:.64rem; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
.room-arrow { color:var(--text-dim); font-size:1.05rem; line-height:1; }

.empty-card { padding:34px 18px; text-align:center; background:var(--card-bg); border:1px solid rgba(43,38,32,.09); border-radius:var(--radius); box-shadow:0 3px 10px rgba(0,0,0,.35); }
.empty-emoji { font-size:34px; line-height:1; }
.empty-title { margin-top:12px; font-size:.88rem; font-weight:800; }
.empty-text { margin-top:6px; font-size:.76rem; line-height:1.65; color:var(--text-dim); }
.empty-actions { margin-top:15px; display:flex; justify-content:center; gap:8px; }
.empty-btn { display:inline-block; padding:8px 16px; border-radius:999px; background:var(--gold); color:#fff; font-size:.74rem; font-weight:800; border:none; cursor:pointer; }
.empty-btn.ghost { background:transparent; border:1px solid rgba(176,116,26,.5); color:var(--gold); }

.skeleton { height:74px; border-radius:var(--radius); background:linear-gradient(100deg, rgba(253,249,238,.34) 30%, rgba(253,249,238,.58) 50%, rgba(253,249,238,.34) 70%); background-size:220% 100%; box-shadow:0 3px 10px rgba(0,0,0,.2); animation:shimmer 1.4s infinite; }
@keyframes shimmer { from { background-position:180% 0; } to { background-position:-60% 0; } }

.load-note { min-height:1em; margin-top:10px; text-align:center; font-size:.68rem; color:rgba(240,225,200,.75); }
.load-note.err { color:#ffc0b4; }
.hall-foot { margin-top:26px; text-align:center; font-size:.66rem; line-height:1.8; color:rgba(240,225,200,.62); text-shadow:0 1px 2px rgba(0,0,0,.35); }

@media (max-width:360px) {
  .hall { padding-left:12px; padding-right:12px; }
  .topbar { padding-left:12px; padding-right:12px; }
  .room-icon { width:40px; height:40px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  .live-dot, .skeleton { animation:none; }
}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="hall-head">
    <a class="hall-back" href="index.html" aria-label="返回首页">‹</a>
    <h1>联机大厅</h1>
    <button class="hall-refresh" id="refreshBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4v7h-7"/></svg>
      <span>刷新</span>
    </button>
  </div>
  <div class="hall-sub">
    <span class="live-dot" aria-hidden="true"></span>
    <span>等待中的房间</span>
    <span class="hall-sep">·</span>
    <span id="updatedAt">正在加载…</span>
  </div>
</header>

<main class="hall">
  <div class="filters" id="filters" role="group" aria-label="按游戏筛选"></div>
  <div class="section-bar">
    <h2>等待中的房间</h2>
    <span class="room-count" id="roomCount" aria-live="polite">正在加载</span>
  </div>
  <div class="room-list" id="roomList" aria-live="polite"></div>
  <p class="load-note" id="loadNote" role="status" aria-live="polite"></p>
  <div class="hall-foot">房间号会自动带入游戏，进入后点「联机」即可加入<br>列表每 30 秒自动刷新</div>
</main>
</div>

<script>
(function(){
'use strict';

var SUPABASE_URL = 'https://smcplxyjjvehbizirvrw.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtY3BseHlqanZlaGJpemlydnJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNTQyMDgsImV4cCI6MjA5ODYzMDIwOH0.TNkL6gOBMyZIt8mB-b-JBPe7_LgJIHXXtHwOW_Xr0qM';
var WINDOW_MS = 60 * 60 * 1000;
var REFRESH_MS = 30 * 1000;
var MAX_ROWS = 200;

var ICO_INFIL = '<svg viewBox="0 0 44 30">' +
  '<path d="M3 4.2 L0.8 5.6 V10.4 L3 9 Z" fill="#3c4550"/>' +
  '<path d="M35.6 1.4 h2.2 v1.6 h-2.2 Z" fill="#3c4550"/>' +
  '<path d="M5.2 1.4 h2.2 v1.6 h-2.2 Z" fill="#3c4550"/>' +
  '<path d="M3 3 H40 V12.4 H3 Z" fill="#525d6b"/>' +
  '<path d="M3 3 H40 V6 H3 Z" fill="#6b7787"/>' +
  '<path d="M14.6 7 h6.4 v1.8 h-6.4 Z" fill="#2c333d"/>' +
  '<circle cx="37.4" cy="7.7" r="2.3" fill="#1a1f26"/>' +
  '<circle cx="37.6" cy="7.7" r="1.1" fill="#39424e"/>' +
  '<path d="M9 12.4 H24.6 V15.6 H9 Z" fill="#46505c"/>' +
  '<path d="M10 15.6 H24.6 L21 28.6 H7.4 Z" fill="#3c4550"/>' +
  '<path d="M10 15.6 H17.4 L14.6 28.6 H7.4 Z" fill="#46505c"/>' +
  '<path d="M24.6 15.6 H31.8 V19.2 Q31.8 22.8 28.2 22.8 Q24.6 22.8 24.6 19.2 Z" fill="#313a44"/>' +
  '<path d="M28.2 16.2 v4.4" stroke="#d9a94b" stroke-width="1.6" stroke-linecap="round" fill="none"/>' +
'</svg>';

var ICO_BOMB = '<svg viewBox="0 0 170 152" aria-hidden="true">' +
  '<g stroke="#25324e" stroke-width="3.5">' +
    '<rect x="14" y="16" width="34" height="106" rx="17" fill="#e8402a"/>' +
    '<rect x="68" y="10" width="34" height="112" rx="17" fill="#e8402a"/>' +
    '<rect x="122" y="18" width="34" height="104" rx="17" fill="#e8402a"/>' +
  '</g>' +
  '<g stroke="#25324e" stroke-width="3">' +
    '<ellipse cx="31" cy="26" rx="13.5" ry="7.5" fill="#ff9b76"/>' +
    '<ellipse cx="85" cy="20" rx="13.5" ry="7.5" fill="#ff9b76"/>' +
    '<ellipse cx="139" cy="28" rx="13.5" ry="7.5" fill="#ff9b76"/>' +
  '</g>' +
  '<rect x="4" y="62" width="162" height="20" rx="9" fill="#25324e"/>' +
  '<rect x="76" y="64" width="18" height="16" rx="4" fill="#f6b62b"/>' +
  '<rect x="36" y="70" width="98" height="74" rx="11" fill="#1d2a44" stroke="#25324e" stroke-width="3.5"/>' +
  '<rect x="46" y="79" width="78" height="30" rx="5" fill="#0e1a33" stroke="#3d5378" stroke-width="2.5"/>' +
  '<text x="85" y="101" text-anchor="middle" fill="#7fd7ff" font-size="21" font-weight="800" letter-spacing="3" font-family="ui-monospace, Consolas, Menlo, monospace">00:02</text>' +
  '<circle cx="57" cy="124" r="9.5" fill="#e8402a" stroke="#25324e" stroke-width="3"/>' +
  '<g fill="#3a4d75">' +
    '<rect x="76" y="108" width="13" height="10" rx="3"/><rect x="92" y="108" width="13" height="10" rx="3"/><rect x="108" y="108" width="13" height="10" rx="3"/>' +
    '<rect x="76" y="121" width="13" height="10" rx="3"/><rect x="92" y="121" width="13" height="10" rx="3"/><rect x="108" y="121" width="13" height="10" rx="3"/>' +
  '</g>' +
'</svg>';

var GAMES = [
  { key:'sjz-',      name:'弑君者OL',   short:'弑君者',   icon:'⚔️', max:4, url:'regicide/index_ol.html' },
  { key:'ymtx-',     name:'月面探险OL', short:'月面探险', icon:'🌕', max:5, url:'moon-adventure/index_ol.html' },
  { key:'taketime-', name:'时序谜局OL', short:'时序谜局', icon:'🕰️', max:4, url:'take-time/index.html' },
  { key:'fug-ol-',   name:'神探缉凶OL', short:'神探缉凶', icon:'🕵️', max:2, url:'fugitive/index_ol.html' },
  { key:'infil-ol-', name:'渗透因子OL', short:'渗透因子', icon:ICO_INFIL, max:5, url:'infiltraitors/index_ol.html' },
  { key:'bomb-',     name:'炸弹克星OL', short:'炸弹克星', icon:ICO_BOMB, max:5, url:'bomb-busters/index.html' }
];

var roomList = document.getElementById('roomList');
var filtersEl = document.getElementById('filters');
var roomCount = document.getElementById('roomCount');
var loadNote = document.getElementById('loadNote');
var updatedAt = document.getElementById('updatedAt');
var refreshBtn = document.getElementById('refreshBtn');

var allRooms = [];
var activeGame = 'all';
var loading = false;
var hasLoaded = false;
var lastSuccess = 0;

function gameMeta(id){
  for (var i = 0; i < GAMES.length; i++){
    if (id.indexOf(GAMES[i].key) === 0) return GAMES[i];
  }
  return null;
}

function maskHost(name){
  var s = String(name || '').replace(/\s+/g, ' ').trim();
  if (!s) return '神秘房主';
  if (/^1[3-9]\d{9}$/.test(s)) return s.slice(0, 3) + '****' + s.slice(7);
  return s;
}

function fmtAgo(ts){
  var diff = Math.max(0, Date.now() - ts);
  var min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚';
  return min + ' 分钟前';
}

function timeNow(){
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
}

function roomQueryUrl(){
  var since = new Date(Date.now() - WINDOW_MS).toISOString();
  return SUPABASE_URL + '/rest/v1/rooms' +
    '?select=id,host_name,status,seats,created_at' +
    '&status=eq.waiting' +
    '&created_at=gte.' + encodeURIComponent(since) +
    '&order=created_at.desc' +
    '&limit=' + MAX_ROWS;
}

function normalize(rows){
  var out = [];
  (rows || []).forEach(function(row){
    if (!row || row.status !== 'waiting') return;
    var meta = gameMeta(String(row.id || ''));
    if (!meta) return;
    var seats = Array.isArray(row.seats) ? row.seats : [];
    if (!seats.length) return;
    var code = String(row.id).slice(meta.key.length);
    if (!/^\d{4}$/.test(code)) return;
    var ts = Date.parse(row.created_at);
    if (!isFinite(ts) || Date.now() - ts > WINDOW_MS) return;
    out.push({
      meta: meta,
      code: code,
      host: row.host_name,
      count: seats.length,
      full: seats.length >= meta.max,
      ts: ts
    });
  });
  return out.sort(function(a, b){ return b.ts - a.ts; });
}

function setBusy(on){
  loading = on;
  refreshBtn.disabled = on;
  refreshBtn.classList.toggle('busy', on);
}

function loadRooms(){
  if (loading) return;
  setBusy(true);
  if (!hasLoaded) renderSkeleton();

  var controller = window.AbortController ? new AbortController() : null;
  var timeout = setTimeout(function(){ if (controller) controller.abort(); }, 12000);
  var options = {
    cache: 'no-store',
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON
    }
  };
  if (controller) options.signal = controller.signal;

  fetch(roomQueryUrl(), options)
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(rows){
      hasLoaded = true;
      lastSuccess = Date.now();
      allRooms = normalize(rows);
      render();
      loadNote.textContent = '';
      loadNote.classList.remove('err');
      updatedAt.textContent = '更新于 ' + timeNow();
    })
    .catch(function(){
      if (!hasLoaded) {
        allRooms = [];
        roomList.textContent = '';
        roomList.appendChild(errorCard());
        roomCount.textContent = '加载失败';
        updatedAt.textContent = '更新失败';
      }
      loadNote.textContent = hasLoaded ? '刷新失败，正在显示上次结果' : '网络不太稳定，请稍后重试';
      loadNote.classList.add('err');
    })
    .then(function(){
      clearTimeout(timeout);
      setBusy(false);
    });
}

function renderSkeleton(){
  roomList.textContent = '';
  for (var i = 0; i < 3; i++){
    var sk = document.createElement('div');
    sk.className = 'skeleton';
    roomList.appendChild(sk);
  }
}

function renderChips(){
  var counts = {};
  allRooms.forEach(function(r){
    counts[r.meta.key] = (counts[r.meta.key] || 0) + 1;
  });
  var html = '<button type="button" class="filter-chip' + (activeGame === 'all' ? ' active' : '') +
    '" data-game="all" aria-pressed="' + (activeGame === 'all') + '">全部' +
    '<span class="chip-num">' + allRooms.length + '</span></button>';
  GAMES.forEach(function(g){
    var active = activeGame === g.key;
    html += '<button type="button" class="filter-chip' + (active ? ' active' : '') +
      '" data-game="' + g.key + '" aria-pressed="' + active + '">' + g.short +
      '<span class="chip-num">' + (counts[g.key] || 0) + '</span></button>';
  });
  filtersEl.innerHTML = html;
}

function render(){
  renderChips();
  var list = allRooms.filter(function(r){
    return activeGame === 'all' || r.meta.key === activeGame;
  });
  var fullCount = list.filter(function(r){ return r.full; }).length;

  if (!list.length) {
    roomCount.textContent = '暂无';
  } else {
    roomCount.textContent = list.length + ' 个房间' + (fullCount ? ' · ' + fullCount + ' 个已满' : '');
  }

  roomList.textContent = '';
  if (!list.length) {
    roomList.appendChild(emptyCard());
    return;
  }
  list.forEach(function(r){
    roomList.appendChild(makeCard(r));
  });
}

function makeCard(r){
  var full = r.full;
  var el = document.createElement(full ? 'div' : 'a');
  el.className = 'room-card' + (full ? ' is-full' : '');
  if (!full) {
    el.href = r.meta.url + '?room=' + r.code;
    el.setAttribute('aria-label', '进入' + r.meta.name + '房间 ' + r.code + '，房主 ' + maskHost(r.host));
  }

  var icon = document.createElement('span');
  icon.className = 'room-icon';
  icon.innerHTML = r.meta.icon;

  var main = document.createElement('div');
  main.className = 'room-main';

  var line = document.createElement('div');
  line.className = 'room-line';
  var title = document.createElement('span');
  title.className = 'room-title';
  title.textContent = r.meta.name;
  var code = document.createElement('span');
  code.className = 'room-code';
  code.textContent = '#' + r.code;
  line.appendChild(title);
  line.appendChild(code);

  var meta = document.createElement('div');
  meta.className = 'room-meta';
  var host = document.createElement('span');
  host.className = 'room-host';
  host.appendChild(document.createTextNode('房主 · '));
  var hostName = document.createElement('b');
  hostName.textContent = maskHost(r.host);
  host.appendChild(hostName);
  var seat = document.createElement('span');
  seat.className = 'seat-pill' + (full ? ' full' : '');
  seat.textContent = r.count + '/' + r.meta.max + ' 人' + (full ? ' · 已满' : '');
  meta.appendChild(host);
  meta.appendChild(seat);

  main.appendChild(line);
  main.appendChild(meta);

  var side = document.createElement('div');
  side.className = 'room-side';
  var time = document.createElement('span');
  time.className = 'room-time';
  time.textContent = fmtAgo(r.ts);
  var arrow = document.createElement('span');
  arrow.className = 'room-arrow';
  arrow.textContent = full ? '' : '›';
  side.appendChild(time);
  side.appendChild(arrow);

  el.appendChild(icon);
  el.appendChild(main);
  el.appendChild(side);
  return el;
}

function emptyCard(){
  var game = null;
  if (activeGame !== 'all') {
    for (var i = 0; i < GAMES.length; i++){
      if (GAMES[i].key === activeGame) { game = GAMES[i]; break; }
    }
  }

  var box = document.createElement('div');
  box.className = 'empty-card';
  var emoji = document.createElement('div');
  emoji.className = 'empty-emoji';
  emoji.textContent = game ? '🪑' : '🕒';
  var title = document.createElement('div');
  title.className = 'empty-title';
  title.textContent = game ? ('暂时没有' + game.short + '的等待房间') : '最近 1 小时还没有等待中的房间';
  var text = document.createElement('div');
  text.className = 'empty-text';
  text.textContent = game ? '换个游戏看看，或者刷新试试。' : '去联机专区开一桌，房间会自动出现在这里。';
  var actions = document.createElement('div');
  actions.className = 'empty-actions';

  if (game) {
    var allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'empty-btn';
    allBtn.textContent = '查看全部房间';
    allBtn.addEventListener('click', function(){
      activeGame = 'all';
      render();
    });
    actions.appendChild(allBtn);
  } else {
    var go = document.createElement('a');
    go.className = 'empty-btn';
    go.href = 'index.html#sec-online';
    go.textContent = '去挑一款联机游戏';
    actions.appendChild(go);
  }

  box.appendChild(emoji);
  box.appendChild(title);
  box.appendChild(text);
  box.appendChild(actions);
  return box;
}

function errorCard(){
  var box = document.createElement('div');
  box.className = 'empty-card';
  var emoji = document.createElement('div');
  emoji.className = 'empty-emoji';
  emoji.textContent = '📡';
  var title = document.createElement('div');
  title.className = 'empty-title';
  title.textContent = '房间列表加载失败';
  var text = document.createElement('div');
  text.className = 'empty-text';
  text.textContent = '检查一下网络，然后再试一次。';
  var actions = document.createElement('div');
  actions.className = 'empty-actions';
  var retry = document.createElement('button');
  retry.type = 'button';
  retry.className = 'empty-btn';
  retry.textContent = '重新加载';
  retry.addEventListener('click', loadRooms);
  actions.appendChild(retry);
  box.appendChild(emoji);
  box.appendChild(title);
  box.appendChild(text);
  box.appendChild(actions);
  return box;
}

filtersEl.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.filter-chip') : null;
  if (!btn) return;
  activeGame = btn.dataset.game;
  render();
});

refreshBtn.addEventListener('click', loadRooms);

document.addEventListener('visibilitychange', function(){
  if (!document.hidden && Date.now() - lastSuccess > REFRESH_MS) loadRooms();
});

setInterval(function(){
  if (!document.hidden) loadRooms();
}, REFRESH_MS);

renderChips();
loadRooms();
})();
</script>
</body>
</html>

<div class="app" id="app" data-screen="home">

  <!-- ================= 封面 ================= -->
  <main class="screen screen-home" data-screen="home">
    <div class="poster">
      <div class="poster-art" aria-hidden="true">
        <div class="poster-burst"></div>
        <div class="poster-mask pm-1"><svg class="mask"><use href="#mask-red"/></svg></div>
        <div class="poster-mask pm-2"><svg class="mask"><use href="#mask-orange"/></svg></div>
        <div class="poster-mask pm-3"><svg class="mask"><use href="#mask-blue"/></svg></div>
        <div class="poster-badge">6 色<br><small>60 张</small></div>
      </div>
      <p class="kicker">六色面具 · 单机人机版</p>
      <h1 class="poster-title">面具摔跤手</h1>
      <p class="poster-en">MASKMEN</p>
      <p class="tagline">六位摔跤手，关系越打越明。<br>先把手里最后一张面具拍在台上的人，赢下赛季。</p>
      <div class="home-actions">
        <button class="btn btn-primary btn-lg" id="btn-start">开始比赛</button>
        <button class="btn btn-ghost" id="btn-continue" hidden>继续上局</button>
      </div>
      <p class="home-save" id="home-save" hidden></p>
      <div class="home-links">
        <button class="linkbtn" data-open="rules">玩法规则</button>
        <button class="linkbtn" data-open="stats">战绩</button>
      </div>
      <p class="home-note">2~6 人 | 你 + 1~5 个 AI</p>
      <p class="home-stats" id="home-stats"></p>
    </div>
  </main>

  <!-- ================= 设置 ================= -->
  <main class="screen screen-setup" data-screen="setup" hidden>
    <div class="setup card">
      <p class="kicker">赛前登记</p>
      <h2 class="setup-title">组建你的擂台</h2>

      <label class="field">
        <span>你的名字</span>
        <input id="player-name" type="text" maxlength="8" autocomplete="off" placeholder="你">
      </label>

      <div class="field">
        <span>AI 对手</span>
        <div class="seg" id="ai-count" role="group" aria-label="AI 对手数量">
          <button type="button" data-count="1">1</button>
          <button type="button" data-count="2">2</button>
          <button type="button" data-count="3">3</button>
          <button type="button" data-count="4">4</button>
          <button type="button" data-count="5">5</button>
        </div>
        <p class="hint" id="ai-hint"></p>
      </div>

      <div class="roster-head">
        <span>经纪人名单</span>
        <span class="diff-chip">难度 · 标准</span>
      </div>
      <ul class="roster" id="roster"></ul>
      <!-- <p class="roster-note">席位图标是经纪人的随身物件；卡面面具才是摔跤手。</p> -->

      <div class="setup-actions">
        <button class="btn btn-ghost" id="btn-setup-back">返回</button>
        <button class="btn btn-primary" id="btn-setup-start">开赛</button>
      </div>
    </div>
  </main>

  <!-- ================= 对局 ================= -->
  <main class="screen screen-game" data-screen="game" hidden>
    <header class="topbar">
      <button class="brand" id="btn-home" aria-label="返回首页">
        <svg class="brand-mask"><use href="#mask-orange"/></svg>
        <span>面具摔跤手</span>
      </button>
      <div class="hud">
        <b id="hud-season">第 1 赛季</b>
        <span id="hud-round">第 1 回合</span>
      </div>
      <div class="top-actions">
        <button class="iconbtn" data-open="rules" aria-label="规则"><svg><use href="#ico-help"/></svg></button>
        <button class="iconbtn" data-open="log" aria-label="日志"><svg><use href="#ico-log"/></svg></button>
        <button class="iconbtn" id="btn-sound" aria-label="声音"><svg><use href="#ico-sound"/></svg></button>
        <button class="iconbtn" id="btn-exit" aria-label="退出"><svg><use href="#ico-exit"/></svg></button>
      </div>
    </header>

    <div class="game-main">
      <section class="turn card" id="turn">
        <div class="turn-main">
          <span class="turn-avatar" id="turn-avatar"></span>
          <div class="turn-text">
            <p class="turn-title" id="turn-title">准备开始</p>
            <p class="turn-sub" id="turn-sub"></p>
          </div>
        </div>
        <div class="trick" id="trick" aria-label="本回合出牌记录"></div>
      </section>

      <section class="board-wrap card">
        <div class="board-head">
          <h2>力量关系</h2>
          <span class="board-legend">上强 ↓ 下弱 · 异列不可比</span>
          <button class="mini" data-open="matrix"><svg><use href="#ico-matrix"/></svg>关系表</button>
        </div>
        <div class="board" id="board"></div>
        <div class="board-foot" id="board-foot"></div>
      </section>

      <section class="seats" id="seats" aria-label="玩家席位"></section>

      <section class="hand-wrap card" id="hand-wrap">
        <div class="hand-head">
          <h2>你的手牌</h2>
          <span class="hand-count" id="hand-count"></span>
        </div>
        <div class="hand" id="hand"></div>
      </section>
    </div>

    <footer class="actions" id="actions">
      <button class="btn btn-pass" id="btn-pass"><svg><use href="#ico-pass"/></svg>跳过本回合</button>
      <button class="btn btn-ghost" data-open="matrix"><svg><use href="#ico-matrix"/></svg>关系表</button>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="live" id="live" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title">标题</h2>
      <button class="iconbtn" id="modal-close" aria-label="关闭"><svg><use href="#ico-close"/></svg></button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<script src="game.js"></script>
<script src="ai.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="../track.js?v=20261125"></script>
</body>
</html>

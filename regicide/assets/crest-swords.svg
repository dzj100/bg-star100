      <path d="M0 29 L5.6 35 L0 45 L-5.6 35 Z"
            fill="url(#crestHilt)" stroke="#221407" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 32 L3 35 L0 38 L-3 35 Z"
            fill="url(#crestGem)" stroke="#4b1009" stroke-width=".6" stroke-linejoin="round"/>
    </g>
  </defs>

  <g transform="translate(120 111) scale(1.5)">
    <g transform="rotate(40) translate(0 55)" opacity=".92">
      <use href="#crestSword"/>
    </g>
    <g transform="rotate(-40) translate(0 55)">
